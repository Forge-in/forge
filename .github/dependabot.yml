version: 2

# WHY THIS FILE EXISTS AT ALL:
#
# Every `uses:` in this repository is pinned to a 40-character commit SHA, because a mutable
# tag lets a third party change what CI executes — with the repo's token and full source in
# scope — without a diff anywhere here. scripts/check-repo-hygiene.mjs enforces that.
#
# A SHA pin with nobody updating it is just a stale, unpatched dependency wearing a security
# hat. Dependabot is the other half: it bumps the SHA, rewrites the trailing `# vX.Y.Z`
# comment to match, and opens a PR with the upstream changelog. Without it, pinning trades a
# supply-chain risk for a rot risk.
#
# It also covers Dependabot ALERTS, which are free on private repositories and watch the same
# advisory database that `pnpm audit:ci` gates on — enable them in repository settings, they
# are not configured from this file.

updates:
  # ─────────────────────────────────────────────────────────────────────────────────────
  # GitHub Actions
  # ─────────────────────────────────────────────────────────────────────────────────────
  # Weekly rather than daily. An action bump is a two-line diff that still needs a human to
  # read an upstream changelog, and a daily cadence on a two-person team produces a queue
  # nobody clears — which is how pins go stale despite the automation existing.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:30'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    commit-message:
      # Matches commitlint's Conventional Commits config. Squash-merge uses the PR title as
      # the commit message, so a non-conforming title fails the PR-title workflow and the
      # bot's own PR cannot merge.
      prefix: ci
    labels: [dependencies, github-actions]
    groups:
      # One PR for all of them. These move together (docker/* releases in particular), and
      # five separate PRs for five two-line diffs is how the queue stops being read.
      actions:
        patterns: ['*']

  # ─────────────────────────────────────────────────────────────────────────────────────
  # npm / pnpm
  # ─────────────────────────────────────────────────────────────────────────────────────
  # `directory: /` with the workspace globs below covers every app and package from one
  # entry: Dependabot resolves the pnpm workspace and updates the single root lockfile,
  # which is the only lockfile CI installs from.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 8
    commit-message:
      prefix: chore
      prefix-development: chore
    labels: [dependencies]

    groups:
      # Patch and minor updates in one PR per area. Batching is what makes these reviewable:
      # eight separate patch bumps get rubber-stamped, one grouped PR with a green e2e run
      # gets read.
      nest:
        patterns: ['@nestjs/*', '@nest-lab/*']
        update-types: [minor, patch]
      opentelemetry:
        patterns: ['@opentelemetry/*']
        update-types: [minor, patch]
      react-and-next:
        patterns:
          ['next', 'react', 'react-dom', '@types/react', '@types/react-dom', 'eslint-config-next']
        update-types: [minor, patch]
      expo-and-react-native:
        patterns:
          [
            'expo',
            'expo-*',
            '@expo/*',
            '@expo-google-fonts/*',
            'react-native',
            'react-native-*',
            '@react-native-async-storage/*',
            'jest-expo',
            'eslint-config-expo',
          ]
        update-types: [minor, patch]
      testing:
        patterns:
          [
            'jest',
            'ts-jest',
            '@types/jest',
            'vitest',
            '@vitest/*',
            'supertest',
            '@types/supertest',
            '@testing-library/*',
            'jsdom',
            'react-test-renderer',
          ]
        update-types: [minor, patch]
      linting-and-formatting:
        patterns:
          [
            'eslint',
            'eslint-*',
            '@eslint/*',
            'typescript-eslint',
            'prettier',
            '@commitlint/*',
            'lint-staged',
            'husky',
            'globals',
          ]
        update-types: [minor, patch]
      database:
        patterns: ['drizzle-orm', 'drizzle-kit', 'pg', '@types/pg']
        update-types: [minor, patch]
      tooling:
        patterns:
          [
            'turbo',
            'tsx',
            'ts-node',
            '@types/node',
            'source-map-support',
            'tsconfig-paths',
            'ts-loader',
          ]
        update-types: [minor, patch]

    ignore:
      # TypeScript is pinned once in the pnpm catalog, deliberately. The two Expo apps used to
      # pin ~6.0.3 while everything else used ^5.9.3, typescript-eslint resolved the TS 6 copy
      # — which it does not support — and every type-aware rule silently degraded to "type
      # could not be resolved" instead of failing loudly. A bot bumping the major here would
      # reopen that hole; the catalog entry is moved by hand after checking
      # typescript-eslint's supported range.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

      # React and React Native majors are coordinated upgrades across five apps and the Expo
      # SDK, not a dependency bump. Minors and patches still come through the groups above.
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: react-native
        update-types: [version-update:semver-major]
      - dependency-name: expo
        update-types: [version-update:semver-major]

      # Node type definitions must track the runtime in .nvmrc, which
      # scripts/check-repo-hygiene.mjs keeps aligned with the Dockerfile base image. Letting
      # the bot move @types/node past it types against APIs the runtime does not have.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  # ─────────────────────────────────────────────────────────────────────────────────────
  # The API base image
  # ─────────────────────────────────────────────────────────────────────────────────────
  # node:22-alpine gets security fixes without the tag moving major, so this mostly produces
  # nothing — which is the point: when it DOES produce something, it is because the base
  # image needs rebuilding for a CVE, and the `image` job's Trivy scan is what would have
  # caught it the hard way.
  #
  # Major bumps are ignored because the Node major is owned by .nvmrc: the hygiene check
  # fails the build if the Dockerfile and .nvmrc disagree, so a bot-raised major here would
  # be red on arrival. Moving Node is a deliberate change to .nvmrc first.
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    labels: [dependencies, docker]
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
