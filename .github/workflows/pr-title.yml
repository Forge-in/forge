name: PR title

# Split out of ci.yml for ONE reason, and it is the reason this check kept showing a stale
# red tick: GitHub's `pull_request` trigger defaults to `opened`, `synchronize` and
# `reopened`. Editing a PR's title fires `edited`, which is not in that list — so fixing the
# title did nothing, the workflow never re-ran, and the old failure stayed on the PR.
#
# "Re-run failed jobs" does not help either: a re-run replays the ORIGINAL event payload, so
# it lints the old title again.
#
# Adding `edited` to ci.yml would have worked but would re-run the entire suite — including
# the e2e job with Postgres and Redis — every time someone tweaked a title or description.
# A separate workflow gets the right trigger for a two-second check.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: pr-title-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: PR title
    runs-on: ubuntu-latest
    # A two-second check behind a one-minute install. Anything past this is a wedged runner.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          # No turbo task runs here, and an unused cache bucket still costs an upload on
          # every PR edit while evicting a real one under the 10 GB limit.
          turbo-cache-scope: ''

      # Squash-merge uses the PR TITLE as the commit message, which bypasses the commit-msg
      # commitlint hook entirely. Without this check, main's history drifts out of
      # Conventional Commits and any future changelog generation silently produces garbage.
      #
      # Uses the repo's OWN commitlint config rather than a third-party title linter, so the
      # rule applied here and the rule applied by the git hook cannot drift apart.
      - name: Lint the PR title as a conventional commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | pnpm commitlint
