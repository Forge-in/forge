name: CodeQL

# Weekly plus pushes to main — deliberately NOT on every pull request.
#
# CodeQL's value is real but its signal is noisy, and for a two-person team a scanner that
# comments on every PR gets muted within a month. Running it on main and on a schedule keeps
# the findings while moving the triage off the critical path of shipping.
#
# The schedule matters as much as the scan: CodeQL's query packs are updated continuously, so
# a weekly run finds newly-published patterns in code that has not changed. A scan that only
# ever ran at merge time would never see those.
on:
  push:
    branches: [main]
  schedule:
    # Mondays 03:00 UTC — 08:30 IST, so results are waiting at the start of the week rather
    # than arriving mid-Friday when nobody will act on them.
    - cron: '0 3 * * 1'
  # So a security fix can be verified without waiting a week.
  workflow_dispatch:

# Cancel a superseded scan; a full analysis is minutes of runner time.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    permissions:
      # Required to upload results to the Security tab.
      security-events: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          # One language covers the whole repo: API, both Next apps, both Expo apps and every
          # shared package. There is no second language to add.
          languages: javascript-typescript

          # security-and-quality rather than the default `security` pack. The extra queries
          # catch the maintainability defects that become security bugs later — an unused
          # variable masking a typo'd guard, a missing await on a promise that was meant to
          # check something. At this codebase size the added noise is affordable.
          queries: security-and-quality

      # No build step. CodeQL analyses TypeScript directly, and `pnpm build` here would only
      # add several minutes and a chance of failing for reasons unrelated to security.
      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
