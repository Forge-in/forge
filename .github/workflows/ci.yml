name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Merge queues run the candidate merge commit through CI before it lands. Without this
  # trigger the queue has no status to wait on and either blocks forever or merges blind.
  # Harmless while the queue is off; already correct the day it is turned on.
  merge_group:
  # So a flake can be re-run against a branch without pushing an empty commit.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only collapse superseded PR runs. A push to main may be mid-deploy, and cancelling that
  # run leaves you unable to tell whether main is green. A merge_group run must not be
  # cancelled either — the queue reads its result to decide whether to merge.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; jobs opt into more where they need it.
permissions:
  contents: read

env:
  # Deterministic, quiet, and no phoning home from a build machine.
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  EXPO_NO_TELEMETRY: '1'
  DO_NOT_TRACK: '1'
  # A CI log is not a terminal. Colour escapes make failures harder to grep and to diff.
  FORCE_COLOR: '0'

jobs:
  # ══════════════════════════════════════════════════════════════════════════════════════
  # One job rather than four. Turbo already parallelises across workspaces, so splitting
  # would pay `pnpm install` four times to save a few seconds. `--continue` means a lint
  # failure does not hide a typecheck failure — you get every problem in one run.
  # ══════════════════════════════════════════════════════════════════════════════════════
  verify:
    name: Verify
    runs-on: ubuntu-latest
    # Healthy runs finish in ~7 minutes. See the note on the e2e job about why every job
    # here carries a ceiling.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The default leaves a usable GITHUB_TOKEN in .git/config for the rest of the job.
          # This job then runs `pnpm install`, which executes third-party lifecycle scripts —
          # any one of which could read that file and push. Nothing here needs to talk to
          # GitHub, so nothing here should be able to.
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          turbo-cache-scope: verify

      # `build` is the addition that matters most. `tsc --noEmit` does not catch Next.js RSC
      # boundary violations, misplaced "use client", or invalid route exports — a PR could be
      # fully green here and still fail to build. The same now holds for the two Expo apps:
      # their `build` is `expo export`, which is the only thing that resolves the Metro graph
      # and so the only thing that catches a bad asset path or a native-only import.
      #
      # `--continue` so a lint failure does not hide a typecheck failure — every problem in
      # one run.
      - name: Lint, typecheck and build
        run: pnpm turbo run lint typecheck build --continue

      # TESTS RUN ALONE. This split is not tidiness, it is the fix for a real and repeatedly
      # misdiagnosed failure.
      #
      # apps/trainer-mobile/jest.config.js documents it at length: App.test.tsx mounts the
      # whole app once per test, ~200ms on an idle machine and roughly 17x that on a runner
      # where `turbo run lint typecheck test build` had two Next builds, two vitest suites and
      # the Nest suite competing for the same two-to-four cores. That produced nine
      # `Exceeded timeout` failures in a suite that passes in 9s when run alone — and the one
      # failure that looked different ("unable to find testID: toast") was a knock-on from the
      # test before it timing out mid-flight, leaving cleanup unfinished and the next query
      # reading a stale tree.
      #
      # Raising testTimeout to 30s treated the symptom. Isolating the fake-timer test into its
      # own file (548a5d2) treated a different symptom. Neither removed the contention, which
      # is the actual cause — and adding `expo export` to `build` made it materially worse:
      # four more Metro bundlers (two apps x android+ios) in the same parallel batch as the
      # React Native suite they were starving.
      #
      # Running the builds first and the tests second costs a minute of wall clock and gives
      # jest an uncontended machine, which is the condition its timeouts were written for.
      #
      # `!cancelled()` rather than a plain sequential step: a lint or build failure above must
      # not stop the tests from reporting, or the "every problem in one run" property that
      # `--continue` exists for is lost at the step boundary instead of inside turbo.
      - name: Test
        if: ${{ !cancelled() }}
        run: pnpm turbo run test

      # `exports`/`files` paths must resolve. Catches the phantom-subpath class of bug that
      # shipped in @forge/theme. Lives HERE rather than in `guardrails` because it needs
      # dist/ to exist: running it there meant a second full `pnpm build` on every CI run,
      # for one script whose prerequisite this job has already paid for.
      #
      # `!cancelled()` on this and the two below for the same reason as the test step: these
      # are seconds-long, independent checks, and a failing test hiding a formatting problem
      # only costs someone a second round trip through CI to find it.
      - if: ${{ !cancelled() }}
        run: node scripts/check-package-files.mjs

      # `turbo run lint` only reaches workspaces. These are the files outside all of them —
      # including the guardrail scripts the `guardrails` job depends on.
      - if: ${{ !cancelled() }}
        run: pnpm lint:repo

      # Root-level and repo-wide, so it is a plain script rather than a turbo task.
      # Prevents the Prettier churn on untouched lines that makes review useless.
      - if: ${{ !cancelled() }}
        run: pnpm format:check

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: '**/coverage/lcov.info'
          if-no-files-found: warn
          retention-days: 7

  # ══════════════════════════════════════════════════════════════════════════════════════
  # Structural invariants that a linter cannot express. Fast, no services, no build.
  # ══════════════════════════════════════════════════════════════════════════════════════
  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Default depth is enough: check-migration-drift.mjs reads the committed journal
          # with `git show HEAD:...`, and HEAD's blobs are present in a depth-1 clone. It
          # needs git, not history — and never a credential.
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          turbo-cache-scope: guardrails

      # Every workspace must declare lint/typecheck/test, and a placeholder test script is
      # rejected. This is what stops `turbo run test` from silently skipping a workspace —
      # the failure mode that made CI green while one assertion ran.
      - run: node scripts/check-workspace-scripts.mjs

      # Repo-shape invariants that have each already cost something: a foreign lockfile
      # beside the pnpm one, an abandoned app directory that pnpm cannot see, a .nvmrc that
      # drifted from the Dockerfile base image, an unpinned action, and a variable added to
      # the e2e environment without the matching turbo passThroughEnv entry.
      - run: node scripts/check-repo-hygiene.mjs

      # Edit the Drizzle schema, forget to generate the migration, and nothing fails until
      # production says "column does not exist". Needs no database — drizzle-kit generate
      # diffs against the committed snapshots.
      - run: node scripts/db/check-migration-drift.mjs

      # Every script above claims to be non-destructive. This is what proves it, and it also
      # catches a generator or formatter that quietly rewrites a committed file — the class
      # of bug where CI passes and the next person's diff is full of noise they did not make.
      - name: Assert the guardrails left the tree unchanged
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::a guardrail modified the working tree; guardrails must be read-only"
            git status --porcelain
            git --no-pager diff
            exit 1
          fi

  # ══════════════════════════════════════════════════════════════════════════════════════
  # Everything that needs real infrastructure. Row-level security is database behaviour —
  # it cannot be unit-tested, and a mocked version would only assert that the mock agrees
  # with the test — so this job is the only place tenant isolation can actually be proven.
  # ══════════════════════════════════════════════════════════════════════════════════════
  e2e:
    name: E2E and tenancy
    runs-on: ubuntu-latest

    # Without a ceiling a hang here runs for six hours before GitHub reaps it. That is not
    # hypothetical: run 33614256291 sat in `turbo run test:e2e` from 09:28 to 15:29, produced
    # no output after the builds finished, blocked the PR for the whole window and reported as
    # "cancelled" rather than as a failure -- which reads like someone cancelled it, not like
    # a bug. A healthy run of this job takes under two minutes.
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge_ci_pw
          POSTGRES_DB: forge
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Required by /readyz and by rate limiting. Not optional in CI for the same reason it
      # is not optional at runtime: an in-memory fallback would make the tests pass while the
      # behaviour they cover silently stops working across multiple containers.
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          turbo-cache-scope: e2e

      # The environment lives in .github/ci/e2e.env rather than in an `env:` block here, so
      # that scripts/check-repo-hygiene.mjs can mechanically compare it against turbo.json's
      # passThroughEnv. See the header of that file: the two drifting apart produces a 429 in
      # a test that has nothing to do with rate limiting, and jest run directly hides it.
      - name: Load the e2e environment
        run: grep -vE '^[[:space:]]*(#|$)' .github/ci/e2e.env >> "$GITHUB_ENV"

      # A missing client fails deep inside a psql invocation with a bare "command not found".
      # Naming it up front costs one line and saves reading a stack of SQL to find out.
      - name: Check the Postgres client is present
        run: |
          set -euo pipefail
          command -v psql >/dev/null || {
            echo "::error::psql is not on PATH on this runner image"; exit 1; }
          psql --version

      # Creates forge_migrator (owns the schema) and forge_app (runtime, NOBYPASSRLS).
      - name: Bootstrap database roles
        run: |
          psql "$SUPERUSER_URL" -v ON_ERROR_STOP=1 \
            -v migrator_password=mig_ci_pw \
            -v app_password=app_ci_pw \
            -f packages/db/sql/bootstrap-roles.sql

      - name: Apply migrations
        run: pnpm --filter @forge/db db:migrate

      # The highest-leverage guard in the repo: catches a table shipped without a policy,
      # which has no symptoms at all — no error, no warning, just a table every studio can
      # read. Costs nothing per feature and protects every future table.
      - name: Assert tenancy invariants
        run: psql "$DATABASE_MIGRATION_URL" -v ON_ERROR_STOP=1 -f scripts/db/assert-tenancy.sql

      # Proves the PR template's "migration is reversible" checkbox rather than trusting it.
      # Re-asserting invariants after the round-trip catches a down-migration that drops a
      # policy the up-migration does not recreate.
      - name: Prove migrations are reversible (up -> down -> up)
        run: |
          set -euo pipefail
          pnpm --filter @forge/db db:rollback
          remaining="$(psql "$SUPERUSER_URL" -tAc \
            "select count(*) from pg_tables where schemaname='public'")"
          if [ "$remaining" != "0" ]; then
            echo "::error::rollback left ${remaining} table(s) behind"
            psql "$SUPERUSER_URL" -c '\dt public.*'
            exit 1
          fi
          pnpm --filter @forge/db db:migrate
          psql "$DATABASE_MIGRATION_URL" -v ON_ERROR_STOP=1 -f scripts/db/assert-tenancy.sql

      # Behavioural half: cross-studio SELECT/UPDATE/DELETE/INSERT, connection reuse, and the
      # composite foreign keys. Runs as forge_app.
      - name: Tenant isolation tests
        run: pnpm turbo run test:int

      # Until the jest rootDir fix in Phase A, this suite existed but was unreachable and had
      # never executed. It runs here so that stays true.
      - name: API end-to-end tests
        run: pnpm turbo run test:e2e

      # Service-container logs are the first thing you want when a connection is refused or a
      # migration deadlocks, and GitHub does not surface them on failure by default.
      - name: Dump service logs
        if: failure()
        run: |
          for c in $(docker ps -aq); do
            echo "::group::$(docker inspect --format '{{.Config.Image}} ({{.Name}})' "$c")"
            docker logs --tail 200 "$c" 2>&1 || true
            echo "::endgroup::"
          done

  # ══════════════════════════════════════════════════════════════════════════════════════
  # Secret hygiene and the dependency advisory gate.
  # ══════════════════════════════════════════════════════════════════════════════════════
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the scan covers what was committed previously, not just the tip.
          # Secret hygiene in this repo is currently clean; this keeps it that way.
          fetch-depth: 0
          persist-credentials: false

      # The gitleaks CLI, not gitleaks-action@v2.
      #
      # The ACTION requires a licence key for organisation-owned repositories — "if you are
      # scanning repos that belong to an organization account, you will need to obtain a free
      # license key" — and Forge-in is an organisation, so it failed before scanning anything.
      # The CLI it wraps is plain MIT and has no such condition.
      #
      # Pinned by version AND verified by checksum. A version pin alone still trusts whatever
      # bytes that release URL serves today; a release asset can be replaced.
      - name: Scan for committed secrets
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          ASSET="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl -sSfL --retry 3 --retry-delay 2 -o "$ASSET" "$BASE/$ASSET"
          curl -sSfL --retry 3 --retry-delay 2 -o checksums.txt \
            "$BASE/gitleaks_${GITLEAKS_VERSION}_checksums.txt"

          # The release ships one checksums file covering every asset. Verify only ours, and
          # fail loudly if the line is absent rather than passing a zero-line verification —
          # `sha256sum -c` on an empty file exits 0.
          grep " $ASSET\$" checksums.txt > wanted.txt
          test -s wanted.txt || { echo "::error::no checksum published for ${ASSET}"; exit 1; }
          sha256sum -c wanted.txt

          tar -xzf "$ASSET" gitleaks
          cd "$GITHUB_WORKSPACE"

          # --redact so a finding never prints the secret itself into a log that is far more
          # widely readable than the commit it came from.
          "$RUNNER_TEMP/gitleaks/gitleaks" detect --redact --verbose --exit-code 1

      - uses: ./.github/actions/setup
        with:
          # Needs the dependency tree resolved for `pnpm audit`, but runs no turbo task, and
          # an unused cache bucket still costs an upload and evicts a real one.
          turbo-cache-scope: ''

      # Replaces actions/dependency-review-action, which is "available for: Public
      # repositories; Private repositories with a GitHub Advanced Security license". This
      # repo is private and has neither, so that step could never pass — it was failing the
      # whole Security job before gitleaks even ran.
      #
      # A bare `pnpm audit --audit-level high` was rejected as the replacement for the
      # opposite reason: it goes red on advisories nobody has triaged, so within a week it is
      # muted or ignored. The gate here fails only on an advisory that has NOT been triaged,
      # on a triage that has EXPIRED, and on a triage that no longer matches anything — so
      # the allowlist cannot quietly become a permanent mute.
      #
      # See .github/audit-allowlist.json for the current triage and its expiry dates.
      - name: Dependency advisory gate
        run: pnpm audit:ci

  # ══════════════════════════════════════════════════════════════════════════════════════
  # The container image.
  #
  # Nothing verified this before. apps/api/Dockerfile is the deployable artefact for the
  # only backend, and a change to a workspace manifest, a turbo prune scope or a dist/ path
  # breaks it with no signal at all until a deploy fails.
  #
  # Building is not enough on its own. The image that regressed last time BUILT fine — it
  # was 805 MB and full of devDependencies, because `pnpm prune --prod` is interactive and
  # so did nothing in a non-TTY build. This job therefore also boots the image against real
  # Postgres and Redis and asserts each property the Dockerfile's comments claim.
  # ══════════════════════════════════════════════════════════════════════════════════════
  image:
    name: API image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      # Used only on the push-to-main path at the end. A pull request — including one from a
      # fork, whose token is read-only regardless — builds and tests but publishes nothing.
      packages: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge_ci_pw
          POSTGRES_DB: forge
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Uncompressed ceiling for the runtime image. The number is a regression guard, not a
      # target: the failure it exists to catch shipped at 805 MB. A correctly pruned image
      # measures ~90 MB today, so 250 leaves room for real dependency growth while still
      # catching a build stage leaking into the runtime one by an order of magnitude.
      #
      # The actual size is printed on every run. If a real dependency pushes past this, raise
      # the line deliberately in a reviewed diff — never delete the check.
      MAX_IMAGE_MB: '250'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Two values that must be computed rather than interpolated.
      #
      # IMAGE NAME: a Docker reference must be lowercase, and `github.repository` preserves
      # the case of the org and repo as GitHub stores them ("Forge-in/forge"). Interpolating
      # it directly produces `ghcr.io/Forge-in/forge/api`, which docker rejects outright.
      # metadata-action lowercases its own `images` input, so only the shell steps below
      # would have broken — and only on the push-to-main path, i.e. after every check passed.
      #
      # BUILT_AT: RFC 3339, computed here rather than read off an event field, because it has
      # to mean "when this image was built" on every trigger — push, pull_request and
      # workflow_dispatch alike. `github.event.repository.updated_at` means none of those.
      - id: build-meta
        run: |
          set -euo pipefail
          echo "image=ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')/api" \
            >> "$GITHUB_OUTPUT"
          echo "built-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Tag and label computation, so the published image carries provenance metadata that
      # `docker inspect` can answer later.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.build-meta.outputs.image }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      # `load: true`, not `push: true`.
      #
      # The image is loaded into the local daemon, asserted against, smoke-tested, scanned,
      # and only then pushed as those exact bytes. Building twice — once to test and once to
      # publish — would mean the artefact that reached the registry was never the one that
      # passed. Attestations are off because a docker-format image loaded into the local
      # daemon cannot carry them; they belong to a later registry-only publish if wanted.
      - name: Build the image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          # Only the tag the steps below address by name. The full metadata tag set is
          # applied at push time, against this same image id.
          tags: forge-api:ci
          labels: ${{ steps.meta.outputs.labels }}
          # Surfaced on /healthz, which is what makes "which build is on staging" answerable.
          # Both default to "unknown" in env.schema.ts, so an image built without them still
          # boots — it just cannot tell you what it is.
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ steps.build-meta.outputs.built-at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # ─── Static assertions about the artefact ─────────────────────────────────────────
      - name: Assert image invariants
        run: |
          set -euo pipefail

          bytes="$(docker image inspect forge-api:ci --format '{{.Size}}')"
          mb=$(( bytes / 1024 / 1024 ))
          echo "runtime image size: ${mb} MB (ceiling ${MAX_IMAGE_MB} MB)"
          if [ "$mb" -gt "$MAX_IMAGE_MB" ]; then
            echo "::error::image is ${mb} MB, over the ${MAX_IMAGE_MB} MB ceiling — a build toolchain has almost certainly leaked into the runtime stage"
            exit 1
          fi

          # The Dockerfile drops to USER node. A root container is one escape away from a
          # root host process, and this is the check that keeps that line honest.
          uid="$(docker run --rm forge-api:ci id -u | tr -d '\r')"
          if [ "$uid" = "0" ]; then
            echo "::error::image runs as root"; exit 1
          fi
          echo "runs as uid ${uid}"

          # The runtime dependency tree, asserted in BOTH directions.
          #
          # Checked against pnpm's SYMLINK FARM — the per-workspace node_modules — and not
          # against node_modules/.pnpm. The virtual store is the wrong place to look: pnpm
          # materialises packages there that it never links anywhere, so `typescript@5.9.3`
          # sits in the store of a correctly pruned production image while being unreachable
          # from every line of code that runs. A store-based check calls that a leak and is
          # simply wrong. `require.resolve` is wrong in the other direction — modern `exports`
          # maps block the `/package.json` subpath, so drizzle-orm probes as absent when it is
          # present and working. What the link farm answers is the actual question: can the
          # running app load this?
          #
          # The ABSENT list is the prune regression this job exists to catch — a compiler or
          # test runner in a production image.
          #
          # The PRESENT list catches the opposite and more dangerous failure: the Dockerfile
          # copies four separate node_modules directories by hand, and dropping one produces
          # an image that builds clean, passes every other assertion here, and then crashes on
          # its first query. It also stops this whole step from passing vacuously if the tree
          # ever moves.
          docker run --rm -i forge-api:ci sh -s <<'ASSERT'
          set -u
          DIRS="node_modules apps/api/node_modules packages/db/node_modules packages/shared/node_modules"
          fail=0
          for pkg in typescript jest ts-jest drizzle-kit @nestjs/cli @nestjs/schematics supertest; do
            for d in $DIRS; do
              if [ -e "$d/$pkg" ]; then echo "LEAKED  $d/$pkg"; fail=1; fi
            done
          done
          for pkg in @nestjs/core @nestjs/common drizzle-orm pg ioredis zod @forge/db @forge/shared; do
            found=0
            for d in $DIRS; do
              if [ -e "$d/$pkg" ]; then found=1; fi
            done
            if [ "$found" -eq 0 ]; then echo "MISSING $pkg"; fail=1; fi
          done
          if [ "$fail" -eq 0 ]; then echo "runtime tree is exactly what it should be"; fi
          exit "$fail"
          ASSERT

          # TZ=UTC is not cosmetic. Every business-day boundary is derived by converting UTC
          # into Asia/Kolkata explicitly, so a container already in local time double-shifts
          # and silently corrupts daily metrics for late-opening branches.
          offset="$(docker run --rm forge-api:ci node -e 'process.stdout.write(String(new Date().getTimezoneOffset()))')"
          if [ "$offset" != "0" ]; then
            echo "::error::container timezone is not UTC (offset ${offset})"; exit 1
          fi
          echo "timezone is UTC"

          # A HEALTHCHECK is what lets an orchestrator replace a wedged container. Losing it
          # is silent: the container simply never reports unhealthy again.
          if ! docker image inspect forge-api:ci \
              --format '{{if .Config.Healthcheck}}ok{{end}}' | grep -q ok; then
            echo "::error::image declares no HEALTHCHECK"; exit 1
          fi
          echo "HEALTHCHECK present"

      # ─── Boot the real thing ──────────────────────────────────────────────────────────
      # Reuses the same connection strings as the e2e job rather than restating them, so the
      # two cannot drift. The application-level variables below are deliberately different —
      # see the NODE_ENV note on the boot step.
      - name: Load the database environment
        run: grep -vE '^[[:space:]]*(#|$)' .github/ci/e2e.env >> "$GITHUB_ENV"

      - name: Bootstrap database roles
        run: |
          psql "$SUPERUSER_URL" -v ON_ERROR_STOP=1 \
            -v migrator_password=mig_ci_pw \
            -v app_password=app_ci_pw \
            -f packages/db/sql/bootstrap-roles.sql

      # Proves the release procedure documented at the bottom of the Dockerfile actually
      # works from THIS image. Migrations are a separate step before the new version starts,
      # because two booting instances would race the same DDL and the runtime role
      # deliberately has no DDL privileges.
      - name: Run migrations from the image
        run: |
          docker run --rm --network host \
            -e DATABASE_MIGRATION_URL="$DATABASE_MIGRATION_URL" \
            forge-api:ci node packages/db/dist/migrate.js

      # NODE_ENV=production deliberately, not `test`. env.schema.ts enforces extra rules only
      # in production — an SMS gateway must be configured, and no CORS origin may be
      # localhost — so booting in test mode would skip exactly the validation a production
      # image has to survive. The MSG91 values are syntactically valid throwaways; nothing in
      # this job sends a message. --network host so the container reaches the service
      # containers, which are published on the runner's loopback interface.
      - name: Boot the image and wait for readiness
        run: |
          set -euo pipefail
          docker run -d --name forge-api-smoke --network host \
            -e NODE_ENV=production \
            -e PORT=4000 \
            -e DATABASE_URL="$DATABASE_URL" \
            -e REDIS_URL="$REDIS_URL" \
            -e JWT_ACCESS_SECRET="$JWT_ACCESS_SECRET" \
            -e JWT_REFRESH_SECRET="$JWT_REFRESH_SECRET" \
            -e CORS_ORIGINS=https://console.smoke.invalid \
            -e MSG91_AUTH_KEY=ci_smoke_msg91_auth_key_not_a_real_key \
            -e MSG91_OTP_TEMPLATE_ID=ci_smoke_template_id \
            -e LOG_LEVEL=warn \
            forge-api:ci

          # /healthz is liveness — "is this process alive?". A container that dies during
          # boot is caught by the running-check rather than as a silent 60-second timeout.
          for i in $(seq 1 60); do
            if ! docker ps --filter name=forge-api-smoke --filter status=running -q | grep -q .; then
              echo "::error::container exited during boot"
              exit 1
            fi
            if curl -fsS --max-time 3 http://127.0.0.1:4000/healthz >/dev/null 2>&1; then
              echo "healthz answered after ${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::/healthz never answered"
              exit 1
            fi
            sleep 1
          done

          # /readyz is the one that proves the image can actually REACH Postgres and Redis —
          # that the pruned production tree contains a working pg and ioredis. A build-only
          # check cannot tell you that, and neither can a liveness probe.
          for i in $(seq 1 60); do
            if curl -fsS --max-time 3 http://127.0.0.1:4000/readyz >/dev/null 2>&1; then
              echo "readyz answered after ${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::/readyz never became ready — the image cannot reach its dependencies"
              curl -sS --max-time 3 http://127.0.0.1:4000/readyz || true
              exit 1
            fi
            sleep 1
          done

          # The probes are excluded from the global /api prefix on purpose. If that exclusion
          # regresses, the probes move to /api/healthz, every container looks dead, and the
          # orchestrator kills all of them at once — so assert the separation, not merely
          # that the app answers somewhere.
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
            http://127.0.0.1:4000/api/healthz)"
          if [ "$code" != "404" ]; then
            echo "::error::/api/healthz returned ${code}; probes must NOT sit behind the /api prefix"
            exit 1
          fi
          echo "probe/prefix separation holds"

          # The build identity the image was stamped with must be the one it reports, or
          # "which build is on staging" has a confident wrong answer instead of no answer.
          body="$(curl -fsS --max-time 5 http://127.0.0.1:4000/healthz)"
          echo "healthz: ${body}"
          case "$body" in
            *"${GITHUB_SHA}"*) echo "image reports its build sha" ;;
            *) echo "::error::/healthz does not report GIT_SHA=${GITHUB_SHA}"; exit 1 ;;
          esac

      - name: Dump container logs
        if: failure()
        run: docker logs --tail 300 forge-api-smoke 2>&1 || true

      - name: Stop the smoke container
        if: always()
        run: docker rm -f forge-api-smoke >/dev/null 2>&1 || true

      # ─── Vulnerability scan of the base image ─────────────────────────────────────────
      # Trivy's database is served from ghcr.io, which rate-limits anonymous pulls. Caching
      # it keeps this job off that limit on a busy day.
      - name: Cache the Trivy database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-

      # OS packages only, deliberately.
      #
      # Trivy would happily scan node_modules too, but the npm tree is already gated by
      # `pnpm audit:ci` in the Security job, which has a triage file with expiry dates. Two
      # scanners over one tree with two different mute mechanisms means a finding silenced in
      # one place still reds the build in the other, and the fix nobody has time for is to
      # mute it twice. This half owns what the other cannot see: alpine, musl, busybox,
      # openssl, curl — everything that arrives with the base image rather than the lockfile.
      #
      # --ignore-unfixed because a CVE with no released fix is not actionable at this layer.
      # The answer there is to change base image, which is a decision, not a build failure.
      - name: Scan the image for OS vulnerabilities
        env:
          TRIVY_VERSION: 0.74.0
        run: |
          set -euo pipefail
          ASSET="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          BASE="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"

          mkdir -p "$RUNNER_TEMP/trivy" "$RUNNER_TEMP/trivy-cache"
          cd "$RUNNER_TEMP/trivy"
          curl -sSfL --retry 3 --retry-delay 2 -o "$ASSET" "$BASE/$ASSET"
          curl -sSfL --retry 3 --retry-delay 2 -o checksums.txt \
            "$BASE/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " $ASSET\$" checksums.txt > wanted.txt
          test -s wanted.txt || { echo "::error::no checksum published for ${ASSET}"; exit 1; }
          sha256sum -c wanted.txt
          tar -xzf "$ASSET" trivy
          cd "$GITHUB_WORKSPACE"

          "$RUNNER_TEMP/trivy/trivy" image \
            --cache-dir "$RUNNER_TEMP/trivy-cache" \
            --scanners vuln \
            --pkg-types os \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --ignorefile .trivyignore \
            --exit-code 1 \
            --format table \
            forge-api:ci

      # ─── Publish ──────────────────────────────────────────────────────────────────────
      # Only from main, and only the bytes every step above just passed.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_NAME: ${{ steps.build-meta.outputs.image }}
        run: |
          set -euo pipefail

          # Fed by a here-string, NOT by `printf ... | while`. A piped while-loop runs in a
          # subshell, so a failed `docker push` inside it cannot reliably fail the step — the
          # image silently does not publish while the job reports success.
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "pushing ${tag}"
            docker tag forge-api:ci "$tag"
            docker push "$tag"
          done <<< "$TAGS"

          # The immutable coordinate. A tag can be moved; a digest is a deploy target that
          # cannot silently become a different image between approval and rollout.
          #
          # Read off the local image rather than off one named tag: every tag pushed above
          # refers to the same manifest, so RepoDigests[0] carries the right digest whichever
          # tag happens to be first — which `type=raw,latest` makes non-obvious.
          digest="$(docker image inspect forge-api:ci \
            --format '{{if .RepoDigests}}{{index .RepoDigests 0}}{{end}}' | cut -d@ -f2)"
          if [ -z "$digest" ]; then
            echo "::error::no repo digest after push — the image did not reach the registry"
            exit 1
          fi

          echo "published: ${IMAGE_NAME}@${digest}"
          {
            echo "### API image published"
            echo
            echo '```'
            echo "${IMAGE_NAME}@${digest}"
            echo '```'
            echo
            echo "Deploy by digest, not by tag."
          } >> "$GITHUB_STEP_SUMMARY"

  # ══════════════════════════════════════════════════════════════════════════════════════
  # One check for branch protection to require.
  #
  # Requiring the individual jobs by name has a failure mode that is easy to miss. A job
  # RENAMED or REMOVED from this file stays in the protection rules as a check that will
  # never report, and the branch is blocked until someone edits repository settings. Worse,
  # a job ADDED here is not required until someone remembers to add it there — so a new gate
  # silently protects nothing. Requiring only this job makes the workflow file the single
  # source of truth for what must pass.
  #
  # `if: always()` plus the explicit result check is load-bearing. Without it this job would
  # be SKIPPED when a dependency fails, and GitHub counts a skipped required check as
  # successful — which would report green on a red pipeline. That is strictly worse than
  # having no gate at all.
  # ══════════════════════════════════════════════════════════════════════════════════════
  ci:
    name: CI
    if: always()
    needs: [verify, guardrails, e2e, security, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to have succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.NEEDS_JSON);
            const entries = Object.entries(needs);

            if (entries.length === 0) {
              console.error("::error::no upstream jobs reported — the needs list is empty");
              process.exit(1);
            }

            let failed = 0;
            for (const [name, job] of entries) {
              const ok = job.result === "success";
              if (!ok) failed += 1;
              console.log(`${ok ? "  ok  " : "FAILED"}  ${name}: ${job.result}`);
            }

            if (failed > 0) {
              console.error(`::error::${failed} of ${entries.length} CI job(s) did not succeed`);
              process.exit(1);
            }
            console.log(`\nAll ${entries.length} CI jobs succeeded.`);
          '

  # The PR title check lives in .github/workflows/pr-title.yml — it needs the `edited`
  # trigger, which this workflow deliberately does not have.
